seed: 42
type: gldm

model:
  in_channels: 3
  img_size: 32
  latent_dim: 128
  hidden_dims: [64, 128, 256]
  variational: true

diffusion:
  T: 1000
  schedule: "linear"
  beta_start: 0.0001
  beta_end: 0.02
  base_channels: 128
  channel_mults: [1, 2, 4]
  time_emb_dim: 256

train:
  batch_size: 128
  epochs: 50
  lr: 0.0002
  log_interval: 100
  checkpoint_dir: "checkpoints"
  vae_checkpoint: "checkpoints/vae_cifar10_epoch10.pt"

data:
  root: "./data"
  num_workers: 4
  val_fraction: 0.1

geometry:
  num_samples: 1 # random probes for diag(J^T J)
  clip_min: 0.1
  clip_max: 10.0

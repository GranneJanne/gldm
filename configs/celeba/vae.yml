seed: 42
type: vae

model:
  in_channels: 3
  img_size: 64 # common CelebA size
  latent_dim: 128
  hidden_dims: [64, 128, 256, 512]
  variational: true

train:
  batch_size: 128
  epochs: 30
  lr: 0.0002
  kld_weight: 0.0001
  recon_loss_type: "l1"
  log_interval: 100
  checkpoint_dir: "experiments/checkpoints/vae_celebA"
  eval_dir: "experiments/vae_eval"

data:
  root: "./data"
  dataset: celebA
  num_workers: 4
  val_fraction: 0.1
